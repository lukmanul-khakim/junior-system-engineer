
services:
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./docker/nginx/conf/nginx-mtls.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      frontend:
        ipv4_address: 10.10.10.3
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped

  wordpress:
    build:
      context: ./docker/wordpress
    environment:
      WORDPRESS_DB_HOST: postgres:5432
      WORDPRESS_DB_NAME: ${POSTGRES_DB}
      WORDPRESS_DB_USER: ${POSTGRES_USER}
      WORDPRESS_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      frontend:
        ipv4_address: 10.10.10.2
      app:
        ipv4_address: 10.10.20.2
      backend:
        ipv4_address: 10.10.30.2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend:
        ipv4_address: 10.10.30.3
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

  app:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.20.0/24

  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.30.0/24

volumes:
  wordpress_data:
  postgres_data:
