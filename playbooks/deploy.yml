
- import_playbook: install-docker.yml

- name: Deploy KITAB WordPress stack
  hosts: app
  become: false
  gather_facts: true

  vars:
    project_dir: "{{ ansible_env.HOME }}/jr-syseng"
    source_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Check required deployment files on control node
      ansible.builtin.stat:
        path: "{{ source_dir }}/{{ item }}"
      loop:
        - .env
        - docker/nginx/certs/server.crt
        - docker/nginx/certs/server.key
        - docker/nginx/certs/mtls/ca.crt
      register: deployment_files
      delegate_to: localhost
      become: false

    - name: Stop if a required deployment file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required deployment file is missing on control node: {{ item.item }}"
      loop: "{{ deployment_files.results }}"

    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Synchronize project source
      ansible.posix.synchronize:
        src: "{{ source_dir }}/"
        dest: "{{ project_dir }}/"
        archive: true
        delete: false
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=.git/"
          - "--exclude=docker/nginx/certs/"
          - "--exclude=*.retry"

    - name: Copy environment configuration
      ansible.builtin.copy:
        src: "{{ source_dir }}/.env"
        dest: "{{ project_dir }}/.env"
        mode: "0600"

    - name: Ensure Nginx certificate directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/docker/nginx/certs"
        state: directory
        mode: "0755"

    - name: Copy TLS certificate
      ansible.builtin.copy:
        src: "{{ source_dir }}/docker/nginx/certs/server.crt"
        dest: "{{ project_dir }}/docker/nginx/certs/server.crt"
        mode: "0644"

    - name: Copy TLS private key
      become: true
      ansible.builtin.copy:
        src: "{{ source_dir }}/docker/nginx/certs/server.key"
        dest: "{{ project_dir }}/docker/nginx/certs/server.key"
        owner: "10003"
        group: "10003"
        mode: "0640"

    - name: Ensure mTLS certificate directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/docker/nginx/certs/mtls"
        state: directory
        mode: "0755"

    - name: Copy mTLS CA certificate
      ansible.builtin.copy:
        src: "{{ source_dir }}/docker/nginx/certs/mtls/ca.crt"
        dest: "{{ project_dir }}/docker/nginx/certs/mtls/ca.crt"
        mode: "0644"

    - name: Build and start application stack
      become: true
      ansible.builtin.command:
        cmd: docker compose up -d --build --wait --wait-timeout 240
        chdir: "{{ project_dir }}"
      register: compose_up
      changed_when: >
        'Creating' in compose_up.stderr or
        'Recreating' in compose_up.stderr or
        'Building' in compose_up.stderr or
        'Started' in compose_up.stderr

    - name: Display deployment output
      ansible.builtin.debug:
        var: compose_up.stdout_lines

    - name: Verify application containers
      become: true
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ project_dir }}"
      register: compose_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: compose_status.stdout_lines
