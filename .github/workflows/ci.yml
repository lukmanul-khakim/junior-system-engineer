name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push WordPress
        uses: docker/build-push-action@v6
        with:
          context: ./docker/wordpress
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kitab-wordpress:latest
            ${{ secrets.DOCKER_USERNAME }}/kitab-wordpress:${{ steps.meta.outputs.sha_short }}

      - name: Build and Push Postgresql
        uses: docker/build-push-action@v6
        with:
          context: ./docker/postgres
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kitab-postgres:latest
            ${{ secrets.DOCKER_USERNAME }}/kitab-postgres:${{ steps.meta.outputs.sha_short }}

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kitab-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/kitab-nginx:${{ steps.meta.outputs.sha_short }}
