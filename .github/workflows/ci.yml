
name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "compose.yml"
      - "compose.mtls.yml"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - "compose.yml"
      - "compose.mtls.yml"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: BUILD VALIDATION
  # Runs on PR, push, and manual dispatch
  # Does not publish images
  # ==========================================
  validate:
    name: Validate Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WordPress
        uses: docker/build-push-action@v6
        with:
          context: ./docker/wordpress
          push: false
          cache-from: type=gha,scope=wordpress
          cache-to: type=gha,mode=max,scope=wordpress

      - name: Build PostgreSQL
        uses: docker/build-push-action@v6
        with:
          context: ./docker/postgres
          push: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Build Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ==========================================
  # JOB 2: PUBLISH IMAGES
  # Runs only on main push or manual main run
  # ==========================================
  publish:
    name: Publish Images to Docker Hub
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and Push WordPress
        uses: docker/build-push-action@v6
        with:
          context: ./docker/wordpress
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-wordpress:latest
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-wordpress:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=wordpress
          cache-to: type=gha,mode=max,scope=wordpress

      - name: Build and Push PostgreSQL
        uses: docker/build-push-action@v6
        with:
          context: ./docker/postgres
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-postgres:latest
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-postgres:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/jr-syseng-nginx:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
